<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#0b1220">
  <title>DevNexa Admin</title>
  <link rel="stylesheet" href="/css/style.css">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
  <div class="shell">
    <header class="topbar"><div class="brand"><span class="brand-icon">☁</span><span>DevNexa <b>Admin</b></span></div><a class="text-link" href="/">User app</a></header>
    <main>
      <section class="hero"><p class="eyebrow">CONTROL CENTER</p><h1>Platform <span>overview.</span></h1><p class="muted">Admin access is restricted to configured Telegram IDs.</p></section>
      <section id="adminLoading" class="panel center"><div class="spinner"></div><p>Verifying admin access…</p></section>
      <section id="adminContent" hidden>
        <div class="stats four">
          <article class="stat-card"><span class="muted small">Total users</span><strong id="totalUsers">—</strong></article>
          <article class="stat-card"><span class="muted small">Active users</span><strong id="activeUsers">—</strong></article>
          <article class="stat-card"><span class="muted small">Projects</span><strong id="activeProjects">—</strong></article>
          <article class="stat-card"><span class="muted small">Sessions</span><strong id="activeSessions">—</strong></article>
        </div>
        <section class="panel"><div class="section-head"><h2>Recent users</h2><button id="refreshAdmin" class="secondary">Refresh</button></div><div class="table-wrap"><table><thead><tr><th>Name</th><th>Telegram ID</th><th>Plan</th><th>Status</th></tr></thead><tbody id="usersTable"></tbody></table></div></section>
      </section>
      <div id="adminError" class="error" hidden></div>
    </main>
    <footer>DevNexa Cloud • Admin Console</footer>
  </div>
  <script src="/js/admin.js"></script>
</body>
</html>
